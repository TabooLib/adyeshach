

#         Powered by TabooLib 6.0         #


Settings:
  debug: false
  # 玩家与单位的可视半径，单位是格（不是区块）
  # 进入范围才发包生成，离开后回收；默认 64 格 ≈ 4 个区块
  # 建议小于 server.properties 的 view-distance × 16（视距 8 区块 ≈ 128 格）
  visible-distance: 64
  # JOIN: 当玩家加入服务器时
  # KEEP_ALIVE: 当玩家发送第一个位置数据包时
  spawn-event: JOIN
  # JOIN 的延迟，最小为 1
  spawn-delay: 20
  # 是否在主线程上进行路径计算
  # 异步计算会带来延迟
  pathfinder-sync: true
  # 当指定的世界不存在时删除单位文件
  delete-file-in-unknown-world:
    - 'dungeon_world_1'
    - 'dungeon_world_2'
    - 'custom?'
  # 可视条件的刷新周期
  view-condition-interval: 40
  # 可见范围的刷新周期
  # 修改后需要重启服务器
  visible-refresh-interval: 10
  # 积分板队伍的ID
  # 启用时可改为："ady_{id}"
  team-id: DISABLED
  # 是否禁用保存功能
  # 使用自定义保存策略时开启
  disable-save: false
  # 是否使用负数虚拟实体 ID
  # 默认关闭，保留正数 ID
  negative-entity-id: false
  # 玩家与单位的交互冷却（毫秒）
  # 左键、右键共用，按玩家计算；0 表示关闭
  interact-cooldown: 1000
