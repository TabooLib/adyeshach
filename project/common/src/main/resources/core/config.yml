

#         Powered by TabooLib 6.0         #


Settings:
  debug: false
  # 必须小于 server.properties 中的 "view-distance"
  visible-distance: 64
  # JOIN: 当玩家加入服务器时
  # KEEP_ALIVE: 当玩家发送第一个位置数据包时
  spawn-event: JOIN
  # JOIN 的延迟，最小为 1
  spawn-delay: 20
  # 是否在主线程上进行路径计算
  # 异步计算会带来延迟
  pathfinder-sync: true
  # 当指定的世界不存在时删除单位文件
  delete-file-in-unknown-world:
    - 'dungeon_world_1'
    - 'dungeon_world_2'
    - 'custom?'
  # 可视条件的刷新周期
  view-condition-interval: 40
  # 可见范围的刷新周期
  # 修改后需要重启服务器
  visible-refresh-interval: 10
  # 积分板队伍的ID
  # 启用时可改为："ady_{id}"
  team-id: DISABLED
  # 是否禁用保存功能
  # 使用自定义保存策略时开启
  disable-save: false
  # 是否使用负数虚拟实体 ID（默认 true）
  # 负数 ID 可彻底避开与服务端真实实体 ID 的冲突。
  # 但部分客户端 mod（如 DragonCore 龙核）无法处理负数实体 ID，
  # 会导致这些 mod 无法在 Adyeshach 单位上渲染模型（只显示原始实体）。
  # 遇到此类兼容问题可设为 false，改用正数 ID（基数自动抬到 15 亿，尽量避免与真实实体 ID 冲突）。
  negative-entity-id: true